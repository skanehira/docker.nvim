name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチで走っている古い実行は打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 緑赤を左右する道具は版を固定する。浮動させると、コードを変えていないのに
# 判定が反転して原因が追えなくなる。
env:
  PLENARY_SHA: 74b06c6c75e4eeb3108ec01852001636d85a932b
  LUACHECK_VERSION: 1.2.0
  # ローカルの `make format` と同じ結果になるよう、開発環境と揃える。
  STYLUA_VERSION: 2.5.2
  E2E_IMAGE: alpine:3.22

jobs:
  test:
    name: test (nvim ${{ matrix.neovim }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 対応する下限 (0.10.0) と最新の安定版の両方で検証する。
        neovim: ["v0.10.0", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: plenary.nvim を取得する
        run: |
          git init "$HOME/plenary.nvim"
          git -C "$HOME/plenary.nvim" fetch --depth 1 https://github.com/nvim-lua/plenary.nvim "$PLENARY_SHA"
          git -C "$HOME/plenary.nvim" checkout FETCH_HEAD

      - name: spec の配置検査
        run: make spec-layout-check

      - name: plugin/*.lua の読み込み検査
        # テストからは require されないため、他のどのゲートにも掛からない。
        run: PLENARY_PATH="$HOME/plenary.nvim" make plugin-check

      - name: 単体・結合テスト
        run: PLENARY_PATH="$HOME/plenary.nvim" make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "luajit-2.1"

      - uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0
        with:
          # 既定値はアクションの版で変わるため明示する。
          luaRocksVersion: "3.13.0"

      - name: luacheck を導入する
        run: luarocks install luacheck "$LUACHECK_VERSION"

      - run: make lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.STYLUA_VERSION }}
          args: --check lua/ plugin/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: stable

      - name: plenary.nvim を取得する
        run: |
          git init "$HOME/plenary.nvim"
          git -C "$HOME/plenary.nvim" fetch --depth 1 https://github.com/nvim-lua/plenary.nvim "$PLENARY_SHA"
          git -C "$HOME/plenary.nvim" checkout FETCH_HEAD

      - name: lua-language-server を導入する
        run: |
          VERSION=3.13.6
          curl -fsSL -o lls.tar.gz \
            "https://github.com/LuaLS/lua-language-server/releases/download/${VERSION}/lua-language-server-${VERSION}-linux-x64.tar.gz"
          mkdir -p "$HOME/lls" && tar -xzf lls.tar.gz -C "$HOME/lls"
          echo "$HOME/lls/bin" >> "$GITHUB_PATH"

      - name: 型検査
        run: PLENARY_PATH="$HOME/plenary.nvim" make typecheck

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: stable

      - name: plenary.nvim を取得する
        run: |
          git init "$HOME/plenary.nvim"
          git -C "$HOME/plenary.nvim" fetch --depth 1 https://github.com/nvim-lua/plenary.nvim "$PLENARY_SHA"
          git -C "$HOME/plenary.nvim" checkout FETCH_HEAD

      - name: docker が使えることを確認する
        run: docker version

      - name: 検証用イメージを取得する
        run: docker pull "$E2E_IMAGE"

      - name: 通しシナリオ (実 docker)
        run: PLENARY_PATH="$HOME/plenary.nvim" DOCKER_NVIM_E2E_IMAGE="$E2E_IMAGE" make test-e2e
